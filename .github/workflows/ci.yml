name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskpilot_test
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: taskpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TASKPILOT_TEST_POSTGRES_URL: postgresql://taskpilot:taskpilot@127.0.0.1:5432/taskpilot_test
      TASKPILOT_TEST_S3_ENDPOINT_URL: http://127.0.0.1:19000
      TASKPILOT_TEST_CONTAINER_IMAGE: python:3.12-slim
      AWS_ACCESS_KEY_ID: taskpilot-test
      AWS_SECRET_ACCESS_KEY: taskpilot-test-secret
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Start S3-compatible integration service
        run: >-
          docker run --detach --rm
          --name taskpilot-minio-${{ github.run_id }}
          --publish 127.0.0.1:19000:9000
          --env MINIO_ROOT_USER=taskpilot-test
          --env MINIO_ROOT_PASSWORD=taskpilot-test-secret
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for S3-compatible integration service
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs taskpilot-minio-${{ github.run_id }}
          exit 1
      - name: Verify formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test backend and PostgreSQL adapter
        run: uv run pytest --cov=taskpilot --cov-report=term-missing
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Test sample repository
        working-directory: examples/sample-api
        run: ../../.venv/bin/python -m pytest -q
      - name: Stop S3-compatible integration service
        if: always()
        run: docker rm --force taskpilot-minio-${{ github.run_id }} || true

  frontend:
    name: Frontend quality and build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskpilot/web format:check
      - run: pnpm --filter @taskpilot/web lint
      - run: pnpm --filter @taskpilot/web test
      - run: pnpm --filter @taskpilot/web build
      - run: pnpm audit --prod --audit-level high

  containers:
    name: Container build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - name: Validate repository overlay
        env:
          TASKPILOT_REPOSITORY_PATH: ${{ github.workspace }}/examples/sample-api
          TASKPILOT_POLICY_PATH: ${{ github.workspace }}/config.live.example.yaml
        run: docker compose -f docker-compose.yml -f docker-compose.repository.yml config --quiet
      - name: Build production images
        env:
          TASKPILOT_BUILD_NETWORK: host
        run: docker compose build
