models:
  default:
    provider: openai
    model: gpt-5-mini
    api_key_env: OPENAI_API_KEY
  planner:
    provider: openai
    model: gpt-5-mini
    api_key_env: OPENAI_API_KEY
  coder:
    provider: local
    model: local-coder
    base_url: http://localhost:11434/v1
    local: true
  reviewer:
    provider: anthropic
    model: claude-sonnet
    api_key_env: ANTHROPIC_API_KEY

routing:
  assignments:
    context: default
    analyst: default
    planner: planner
    architect: planner
    coder: coder
    reviewer: reviewer
    reporter: default

repository:
  allowed_roots:
    - ./examples
  max_file_bytes: 262144
  max_context_bytes: 1048576
  allow_writes: true
  allow_commands: true
  command_timeout_seconds: 120
  max_command_output_bytes: 1048576
  allowed_commands:
    - [python, -m, pytest]
    - [pytest]
    - [ruff, check]
    - [ruff, format, --check]
    - [npm, test]
    - [npm, run, lint]

workflow:
  max_repair_attempts: 2
  require_plan_approval: true
  require_command_approval: false
  require_write_approval: false

observability:
  langsmith_enabled: false
  log_level: INFO
