[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taskpilot-ai"
version = "0.1.0"
description = "Human-governed graph orchestration for software engineering delivery"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Saurabh Chase" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
taskpilot = "taskpilot.cli.app:app"
taskpilot-api = "taskpilot.runtime:main"

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
anthropic = ["langchain-anthropic>=1.0,<2"]
demo = ["httpx2>=2.11,<3", "pytest>=8.3,<10"]
postgres = [
  "asyncpg>=0.30,<1",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskpilot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "scenario: repeatable end-to-end evaluation scenario",
  "live: opt-in integration test that invokes a configured model provider",
  "postgres: integration test requiring TASKPILOT_TEST_POSTGRES_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["taskpilot"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["taskpilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
